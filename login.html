<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Expense Tracker</title>

      <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl overflow-hidden grid md:grid-cols-2">
          <!-- LEFT SIDE -->
       <div class="bg-blue-600 text-white p-8 flex flex-col justify-center">
        <h1 class="text-4xl font-bold mb-4">
            Expense Tracker
        </h1>

        <p class="text-blue-100 text-lg">
            Manage your income, expenses and savings in one place.
        </p>

        <div class="mt-10 text-7xl">
          💰
        </div>

       </div>

       <!-- RIGHT SIDE -->

       <div class="p-8">

        <h2 class="text-3xl font-bold text-slate-900">
             Welcome Back
        </h2>

        <p class="text-slate-500 mt-2 mb-8">
             Login to continue to your expense tracker.
        </p>

        <form id="loginForm" class="space-y-5">

            <div>

                <label for="email" class="block text-medium font-md text-slate-500 mb-2">
                    Email
                </label>

                <input type="email" id="email" placeholder="Enter your email"
                class="w-full border border-slate-300 rounded-lg px-4 py-3
                outline-none focus:ring-2 focus:ring-blue-500">

            </div>

            <div>

                <label for="password" class="block text-medium font-md text-slate-500 mb-2">
                    Password
                </label>

                <input type="password" id="password" placeholder="Enter your password"
                class="w-full border border-slate-300 rounded-lg px-4 py-3
                outline-none focus:ring-2 focus:ring-blue-500">

            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 
            rounded-lg hover:bg-blue-700 transition">
                Login
            </button>

        </form>

        <p id="errorMessage" class="text-red-500 text-sm mt-3">

        </p>

       </div>


    </div>
    
        <script src="login.js"></script>


</body>
</html>
